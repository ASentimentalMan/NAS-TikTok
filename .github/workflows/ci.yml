name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server_go/go.mod
          cache: false

      - name: Run Go tests
        working-directory: server_go
        run: go test ./...

      - name: Run Go race tests
        working-directory: server_go
        run: go test -race ./...

      - name: Run Go vet
        working-directory: server_go
        run: go vet ./...

      - name: Build Go server
        working-directory: server_go
        run: go build -trimpath -o "$RUNNER_TEMP/nas-tiktok" ./cmd/nas-tiktok

  frontend:
    name: Frontend checks and dependency audit
    runs-on: ubuntu-latest
    env:
      npm_config_cache: /tmp/nas-tiktok-npm-cache
      npm_config_logs_dir: /tmp/nas-tiktok-npm-logs
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run frontend tests
        run: npm test

      - name: Type-check frontend
        run: npm run type-check

      - name: Build frontend
        run: npm run build

      # AUDIT-030's Vite 6.3.5 pin was upgraded to 8.3.4; keep this current audit blocking.
      - name: Audit frontend dependencies
        run: npm audit
